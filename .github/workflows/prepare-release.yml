name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example, 0.1.1 or 0.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Commit version and start release
    if: github.repository == 'Chia-Network/timelord-app'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.REPO_COMMIT || github.token }}
      USE_AUTOMATION_TOKEN: ${{ secrets.REPO_COMMIT != '' }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure authenticated Git access
        run: gh auth setup-git
      - name: Verify automation account and repository access
        if: env.USE_AUTOMATION_TOKEN == 'true'
        run: |
          account="$(gh api user --jq .login)"
          if [[ "$account" != ChiaAutomation ]]; then
            echo "REPO_COMMIT must authenticate as ChiaAutomation for this repository's main branch exception." >&2
            exit 1
          fi
          can_push="$(gh api "repos/$GH_REPO" --jq .permissions.push)"
          if [[ "$can_push" != true ]]; then
            echo "REPO_COMMIT does not report repository write access." >&2
            exit 1
          fi
      - name: Validate version and require a fresh tag
        run: |
          number='(0|[1-9][0-9]*)'
          [[ "$VERSION" =~ ^${number}\.${number}\.${number}(-(beta|rc)\.${number})?$ ]]
          test "$VERSION" != "$(bash scripts/release-version.sh)"
          existing_refs="$(git ls-remote origin "refs/tags/v$VERSION")"
          if [[ -n "$existing_refs" ]]; then
            echo "Tag v$VERSION already exists. Retry Release against that tag, or choose a new version." >&2
            exit 1
          fi
      - name: Install build dependencies
        run: brew install cmake gmp boost prometheus gnupg
      # Same importer used by Chia-Network/actions/commit-sign/gpg, pinned here.
      - name: Set up ChiaAutomation commit and tag signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.CHIA_AUTOMATION_PRIVATE_GPG_KEY }}
          passphrase: ${{ secrets.CHIA_AUTOMATION_PRIVATE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Update workspace and lockfile versions
        run: bash scripts/prepare-release.sh "$VERSION"
      - name: Commit version and atomically push main and tag
        run: |
          bash scripts/push-release.sh "$VERSION"
          echo "Created v$VERSION at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
          echo "To retry Release: gh workflow run release.yml --ref v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Start Release against the version tag
        if: env.USE_AUTOMATION_TOKEN != 'true'
        run: |
          # Tags pushed with GITHUB_TOKEN do not trigger push workflows.
          # Release runs CI itself before signing and creating the draft.
          gh workflow run release.yml --ref "v$VERSION"
      - name: Report release handoff
        run: |
          # An automation token's tag push triggers Release directly; dispatching
          # as well would start a second signed build for the same tag.
          echo "Release started for v$VERSION. Follow Actions → Release, then review and publish its draft." >> "$GITHUB_STEP_SUMMARY"
