name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example, 0.1.1 or 0.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Commit version and start release
    if: github.repository == 'Chia-Network/timelord-app'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PREPARE_TOKEN || github.token }}
      USE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_PREPARE_TOKEN != '' }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure authenticated Git access
        run: gh auth setup-git
      - name: Validate version and require a fresh tag
        run: |
          number='(0|[1-9][0-9]*)'
          [[ "$VERSION" =~ ^${number}\.${number}\.${number}(-(beta|rc)\.${number})?$ ]]
          test "$VERSION" != "$(bash scripts/release-version.sh)"
          existing_refs="$(git ls-remote origin "refs/tags/v$VERSION")"
          if [[ -n "$existing_refs" ]]; then
            echo "Tag v$VERSION already exists. Retry Release against that tag, or choose a new version." >&2
            exit 1
          fi
      - name: Install build dependencies
        run: brew install cmake gmp boost prometheus
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Update workspace and lockfile versions
        run: bash scripts/prepare-release.sh "$VERSION"
      - name: Commit version and atomically push main and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/push-release.sh "$VERSION"
          echo "Created v$VERSION at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
          echo "To retry Release: gh workflow run release.yml --ref v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Start Release against the version tag
        if: env.USE_AUTOMATION_TOKEN != 'true'
        run: |
          # Tags pushed with GITHUB_TOKEN do not trigger push workflows.
          # Release runs CI itself before signing and creating the draft.
          gh workflow run release.yml --ref "v$VERSION"
      - name: Report release handoff
        run: |
          # An automation token's tag push triggers Release directly; dispatching
          # as well would start a second signed build for the same tag.
          echo "Release started for v$VERSION. Follow Actions → Release, then review and publish its draft." >> "$GITHUB_STEP_SUMMARY"
