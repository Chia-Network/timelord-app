name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  checks:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake gmp boost
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Check formatting, lint, native fixtures, Rust and Swift tests
        run: bash scripts/check.sh

  bundle:
    name: Apple Silicon app bundle
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake gmp boost
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned chiavdf client
        run: bash scripts/build-native-control.sh
      - name: Assemble and verify developer app
        run: |
          test "$(uname -m)" = arm64
          bash scripts/bundle-dev.sh
          codesign --verify --deep --strict build/Timelord.app
          build/Timelord.app/Contents/Helpers/timelord-service --version
          ditto -c -k --sequesterRsrc --keepParent build/Timelord.app build/Timelord-macos-arm64.zip
          shasum -a 256 build/Timelord-macos-arm64.zip > build/Timelord-macos-arm64.zip.sha256
      - name: Upload developer app and native provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Timelord-macos-arm64
          path: |
            build/Timelord-macos-arm64.zip
            build/Timelord-macos-arm64.zip.sha256
            build/controlled-native/provenance.txt
          if-no-files-found: error
          retention-days: 14
