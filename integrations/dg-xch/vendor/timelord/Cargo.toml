[package]
name = "dg_xch_timelord"
description = "Native CPU VDF workers and authenticated regular and compact timelord services"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr jhoerr@galactechs.com"]
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls", "chia-hf2"] }
dg_xch_servers = { path = "../servers" }
dg_xch_vdf = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
dg_xch_pos = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
futures-util = "0.3.32"
rustls = "0.23.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
dg_xch_serialize = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
