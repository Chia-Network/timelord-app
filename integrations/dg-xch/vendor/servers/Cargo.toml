[package]
name = "dg_xch_servers"
description = "Server support for Chia-compatible peer WebSocket protocols"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr jhoerr@galactechs.com"]
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
directories = "6.0.0"
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"] }
dg_xch_core = {path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_clients = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version = "3.0.0" }
dg_xch_keys = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version = "3.0.0" }
dg_xch_pos = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version = "3.0.0" }
dg_xch_serialize = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version = "3.0.0" }
http-body-util = { version = "0.1.3"}
http = "1.3.1"
hyper = {version="1.7.0", features=["full"]}
hyper-tungstenite = "0.19.0"
hyper-util = {version="0.1.17", features=["full"]}
log = "0.4.29"
prometheus = {version="0.14.0", features=["protobuf"], optional = true}
rustls = {version = "0.23.45" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3"
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-rustls = { version = "0.26.4" }
tokio-tungstenite = {version = "0.28.0", features = ["rustls", "rustls-tls-webpki-roots"] }
uuid = {version="1.21.0", features=["v4"]}

[features]
metrics = ["dep:prometheus", "dg_xch_core/metrics", "dg_xch_clients/metrics"]
default = []
