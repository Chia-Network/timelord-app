# Modified by Chia Network for timelord-app; see integrations/dg-xch/VENDORING.md
[package]
name = "dg_xch_core"
description = "Core library containing type/error definitions, CLVM tools, Consensus and Pool definitions"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr jhoerr@galactechs.com"]
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
chia-pos2 = { version = "=1.0.0", optional = true }
serde_json = "1.0.145"
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"], optional = true }
bytes = "1.11.1"
const-hex = "1.16.0"
der = "0.8.3"
dg_xch_macros = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version="3.0.0"}
dg_parser_macro = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version="3.0.0"}
dg_xch_serialize = {git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", version="3.0.0"}
futures-util = "0.3.32"
hex = "0.4.3"
ring = "0.17.14"
hkdf = "0.13.0"
hyper = {version="1.8.1", features=["full"]}
hyper-util = {version="0.1.20", features=["full"]}
log = "0.4.29"
libc = "0.2.189"
rayon = "1.12.0"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-integer = "0.1.46"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rand = "0.10.0"
regex = "1.12.3"
rustls = {version = "0.23.45" }
rustls-pemfile = "2.2.0"
rsa = { version = "0.9.10", features = ["std", "pem", "sha2"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { version = "0.10.9", features = ["oid"] }
time = { version = "0.3.47", features = ["serde"]}
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net", "io-util"]}
tokio-tungstenite = {version = "0.30.0", features = ["rustls", "rustls-tls-webpki-roots"] }
uuid = {version="1.21.0", features=["v4"]}
x509-cert = { version = "0.3.0", features = ["std", "pem", "builder"] }

[features]
chia-hf2 = ["dep:chia-pos2"]
# BLS12-381 cryptography via blst (C + assembly). Default-on. Disabling it leaves the
# pure-data surface (wire/chain types, serialization, RPC structs) compiling without a
# C toolchain dependency on blst; the CLVM VM stays available but the BLS opcodes error,
# and the consensus validation/producer modules, signing helpers and key conversions are
# compiled out — a `bls`-less build is NOT consensus-capable.
bls = ["dep:blst"]
bounded-bls = ["bls", "blst/no-threads"]
# Compatibility feature: upstream clients/servers forward `dg_xch_core/metrics`.
# The timelord does not use farmer/harvester metrics, so this is intentionally empty.
metrics = []
default = ["bls"]
