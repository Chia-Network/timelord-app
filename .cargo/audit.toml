[advisories]
# Reviewed 2026-11-20 against Chia-Network/dg_xch_utils a7d288357ec89c54121a329d6f9867ed472e8922.
# dg_xch_core unconditionally depends on rsa 0.9 for certificate-generation helpers.
# Timelord imports existing identities and uses only its PEM-loading helpers;
# network TLS private-key operations use rustls with the AWS-LC provider, not rsa.
# The affected RustCrypto RSA private-key operations are not used by this app.
# https://rustsec.org/advisories/RUSTSEC-2023-0071 is fixed in rsa >= 0.10.0;
# remove this exception once the fork moves dg_xch_core to rsa 0.10 (which also
# needs the x509-cert 0.3 certificate-builder migration in core/src/ssl.rs).
ignore = ["RUSTSEC-2023-0071"]
