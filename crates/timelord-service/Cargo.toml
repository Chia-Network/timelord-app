[package]
name = "timelord-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
timelord-core = { path = "../timelord-core" }
vdf-client-protocol = { path = "../vdf-client-protocol" }
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
yaml-rust2 = "0.11"
libc.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dg_xch_core.workspace = true
dg_xch_timelord.workspace = true
dg_xch_servers.workspace = true
dg_xch_vdf.workspace = true
dg_xch_serialize.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
num-bigint.workspace = true
x509-cert.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Unifies this feature with the upstream VDF crate's SHA-256 dependency.
sha2 = { version = "0.10.9", features = ["asm"] }

[dev-dependencies]
rcgen = "0.13"
