[workspace]
members = ["crates/timelord-core", "crates/vdf-client-protocol", "crates/timelord-service", "crates/timelord-supervisor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
libc = "0.2"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time", "process"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dg_xch_core = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a", default-features = false, features = ["bls"] }
dg_xch_timelord = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
dg_xch_servers = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
dg_xch_vdf = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
dg_xch_serialize = { git = "https://github.com/GalactechsLLC/dg_xch_utils", rev = "ca437be562cec5f0514f6edd4c794adfe382dd8a" }
x509-cert = "0.2"
num-bigint = "0.4"
futures-util = "0.3"
rustls = "0.23"
tokio-rustls = "0.26"
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
