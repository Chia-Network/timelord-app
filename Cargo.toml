[workspace]
members = ["crates/timelord-core", "crates/vdf-client-protocol", "crates/timelord-service", "crates/timelord-supervisor"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
libc = "0.2"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time", "process"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# dg_xch crates come from the Chia-Network fork branch chia/timelord-app-deps;
# see integrations/dg-xch/VENDORING.md. Keep all five on the same rev.
dg_xch_core = { git = "https://github.com/Chia-Network/dg_xch_utils", rev = "d71e119cfe0566eb6d253f6819f137d3bbc2dae5", default-features = false, features = ["bls"] }
dg_xch_timelord = { git = "https://github.com/Chia-Network/dg_xch_utils", rev = "d71e119cfe0566eb6d253f6819f137d3bbc2dae5" }
dg_xch_servers = { git = "https://github.com/Chia-Network/dg_xch_utils", rev = "d71e119cfe0566eb6d253f6819f137d3bbc2dae5" }
dg_xch_vdf = { git = "https://github.com/Chia-Network/dg_xch_utils", rev = "d71e119cfe0566eb6d253f6819f137d3bbc2dae5" }
dg_xch_serialize = { git = "https://github.com/Chia-Network/dg_xch_utils", rev = "d71e119cfe0566eb6d253f6819f137d3bbc2dae5" }
x509-cert = "0.3"
num-bigint = "0.5"
futures-util = "0.3"
rustls = "0.23"
tokio-rustls = "0.26"
tokio-tungstenite = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
