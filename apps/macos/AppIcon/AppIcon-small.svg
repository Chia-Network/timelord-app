    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <clipPath id="clip"><path d="M285 100 H739 A185 185 0 0 1 924 285 V739 A185 185 0 0 1 739 924 H285 A185 185 0 0 1 100 739 V285 A185 185 0 0 1 285 100 Z"/></clipPath>
